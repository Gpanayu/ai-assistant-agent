<!DOCTYPE html>
<head>
  <style>
    #editor-container {
      position: relative;
      padding: 20px;
      border: 1px solid #ccc;
      background: #f8f8f8;
      font-family: monospace;
      white-space: pre-wrap;
      max-height: 500px;
      overflow: scroll;
    }

    .cursor {
      position: absolute;
      background: yellow;
      padding: 2px 5px;
      border-radius: 3px;
      font-size: 12px;
      white-space: nowrap;
    }

    ul > li {
      display: inline-block;
    }
    #users {
      list-style-type: none;
      padding: 0;
      margin: 0;
    }
  </style>
</head>

<body>
  <h1>Dashboard</h1>

  <form id="notificationForm" style="position:absolute;">
    <ul id="users">
      {% for items in connections %}
        <li>
          <label>
            <input name="selected_users[]" type="checkbox" value="{{ items.id }}">
            <span>{{items.id}}</span>
          </label>
        </li>
      {% endfor %}
    </ul>
    <select name="notification_type" required>
      <option selected="selected" value="1" disabled>Notification Options</option>
      <option value="2">Trade Tasks</option>
      <option value="3">Refocus Effort to Easier</option>
      <option value="4">Refocus Effort to Harder</option>
      <option value="5">Check-in with Teammates</option>
    </select>
    <button type="submit">Send Notification</button>
  </form>

  <br><br>
  <h2>Live Document Editor</h2>
  <div id="editor-container">
    <div id="document-state"></div>
    <!-- <div id="cursor-container"></div> -->
  </div>

  <script>
    const ws = new WebSocket("ws://localhost:8000/ws/control");
    const documentState = document.getElementById("document-state");
    const cursorContainer = document.getElementById("cursor-container");

    ws.onmessage = function (event) {
      const data = JSON.parse(event.data);
      if (data["event"] === "document_update") {
        documentState.innerText = data["payload"]["doc"];
        //cursorContainer.innerHTML = "";

        /*
        Object.entries(data["payload"]["cursor_positions"]).forEach(([userId, cursorPos]) => {
          const cursor = document.createElement("div");
          cursor.className = "cursor";
          cursor.textContent = ` ${userId}`;
          cursor.style.left = cursorPos * 10 + "px"; // Adjust scale if needed
          cursorContainer.appendChild(cursor);
        });
        */
      }
    }


    document.getElementById("notificationForm").addEventListener("submit", function(event) {
        event.preventDefault();

        const formData = new FormData(this);

        // Convert checkboxes into an array
        const selectedUsers = [];
        document.querySelectorAll('input[name="selected_users[]"]:checked').forEach((checkbox) => {
            selectedUsers.push(checkbox.value);
        });

        const data = {
            selected_users: selectedUsers,
            notification_type: formData.get("notification_type")
        };

        fetch("/notify", {
            method: "POST",
            body: JSON.stringify(data),
            headers: { "Content-Type": "application/json" }
        })
        .then(response => response.json())
        .then(data => {
            console.log("Success:", data);
            alert("Notification sent!");
        })
        .catch(error => {
            console.error("Error:", error);
        });
    });
  </script>
</body>
