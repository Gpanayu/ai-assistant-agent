<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Control</title>
    <base href="/" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="stylesheet" href="/src/styles.css" />

    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://unpkg.com/dagre-d3@0.6.4/dist/dagre-d3.min.js"></script>
    <script src="https://unpkg.com/tippy.js@6/dist/tippy-bundle.umd.js"></script>
  </head>
  <body>
    <h1>Control</h1>
    <button id="fetch">Fetch state</button>
    <div id="editors">
      <div id="view" class="view" ></div>
      <div id="individuals"></div>
    </div>
    <div id="notification">
      <h1>Notifications</h1>
      <div id="participants"></div>
      <p>Options:</p>
      <form id="notificationForm">
        <input type="checkbox" id="checkin" name="option[]" value="1">
        <label for="checkin">Check-in with Teammate </label><br>
        <input type="checkbox" id="downtree" name="option[]" value="2">
        <label for="downtree">Work on Task next on tree</label><br>
        <input type="checkbox" id="sametree" name="option[]" value="3">
        <label for="sametree">Work on Task on the same level</label><br>
        <input type="checkbox" id="wait" name="option[]" value="4">
        <label for="wait">Wait before continuing</label><br>
        <input type="checkbox" id="help" name="option[]" value="5">
        <label for="help">Request Help</label><br>
        <button type="submit">Submit</button>
      </form>
    </div>

    <script>

      document.getElementById("notificationForm").addEventListener("submit", function(event) {
        event.preventDefault();

        // Convert checkboxes into an array
        const selectedUsers = [];
        document.querySelectorAll('input[name="selected_users[]"]:checked').forEach((checkbox) => {
          selectedUsers.push(checkbox.id);
        });

        const options = [];
        document.querySelectorAll('input[name="option[]"]:checked').forEach((checkbox) => {
          options.push(checkbox.value);
        });

        const data = {
          users: selectedUsers,
          options: options
        };

        fetch("https://prime-lab.cs.vt.edu:8000/notify", {
          method: "POST",
          body: JSON.stringify(data),
          headers: { "Content-Type": "application/json" }
        })
          .then(response => response.json())
          .then(data => {
            console.log("success")
          })
          .catch(err => {
            console.log(err)
          })
      });
    </script>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
