<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <title>Intro</title>
    <style>
      body {
        font-family: Inter, system-ui, Avenir, Helvetica, Arial, sans-serif;
        line-height: 1.5;
        margin: 0;
        padding: 0;
        height: 100vh;
        display: grid;
        place-items: center;
      }

      .container {
        display: flex;
        justify-content: space-between;
      }

      .container > span {
        border: 1px solid black;
        border-radius: 2px;
        padding: 20px 25px 20px 25px;
      }

      .container > span:hover {
        background-color: whitesmoke;
      }

      .container > span.active {
        background-color: lightcyan;
      }

      .submit {
        margin-top: 10px;
        padding: 5px;
      }

      .observe {
        position: absolute;
        top: 0;
        right: 0;
        margin: 5px;
      }
    </style>

  </head>
  <body>
    <div x-data="form">
      <h1>Welcome To The Study</h1>
      <p>Which participant are you?</p>
      <div class="container">
        <span @click="selected = 'A'" :class="selected === 'A' ? 'active' : ''">A</span>
        <span @click="selected = 'B'" :class="selected === 'B' ? 'active' : ''">B</span>
        <span @click="selected = 'C'" :class="selected === 'C' ? 'active' : ''">C</span>
      </div>

      <button @click="save" class="submit">Submit</button>
      <button @click="selected = 'O'" class="observe">
        Observer
      </button>
    </div>

    <script>
      document.addEventListener('alpine:init', () => {
        Alpine.data('form', () => ({
          selected: "",
          save() {
            if(this.selected !== "") {
              localStorage.setItem("id", this.selected)
              window.location.href = '/editor';
            }
          }
        }))
      })
    </script>
  </body>
</html>
