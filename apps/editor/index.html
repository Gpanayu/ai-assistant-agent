<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://kit.fontawesome.com/3efd7c2f05.js" crossorigin="anonymous"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://unpkg.com/dagre-d3@0.6.4/dist/dagre-d3.min.js"></script>
    <script src="https://unpkg.com/@popperjs/core@2/dist/umd/popper.min.js"></script>
    <script src="https://unpkg.com/tippy.js@6/dist/tippy-bundle.umd.js"></script>
    <title>Acme</title>

    <style>
      .node rect {
        stroke: #999;
        fill: #fff;
        rx: 4;
        ry: 4;
        cursor: pointer;
        transition: fill 0.3s ease;
      }
      .node.checked1 rect {
        fill: #FFFF66;
        stroke: #9ea30d;
      }
      .node.checked2 rect {
        fill: #a3e635;
        stroke: #65a30d;
      }
      .edgePath path {
        stroke: #999;
        fill: none;
        stroke-width: 1.5px;
      }
      text {
        font-family: sans-serif;
        font-size: 14px;
        pointer-events: none;
      }
      svg {
        width: 100%;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <div class="topContainer">
      <div>
        <h1>Collaborative Editor</h1>
        <span id="id">id: </span>
      </div>
      <div>
        <input
              id = "nameInput"
              name="nameInput"
              type="text"
              placeholder="Name"
              autocomplete="off"/>
        <button id="update">Update</button>
      </div>
    </div>
    <ul id="tabs">
      <div>
        <li class="tab active" data-tab="0">Collab</li>
        <li class="tab" data-tab="1">Playground</li>
      </div>

      <section class="buttons">
        <button class="button-tab" id="run">
          <i class="fa-solid fa-play"></i>
          Run
        </button>
        <button class="button-tab" id="clear">
          <i class="fa-solid fa-broom"></i>
          Clear
        </button>
        <button class="button-tab" id="toggle">
          <i class="fa-solid fa-grip"></i>
          Toggle View
        </button>
      </section>
    </ul>
    <main id="editorContainer" class="vertical">
      <div id="editor" class="editor tab-pane active" data-pane="0"></div>
      <div id="secondary" class="editor tab-pane" data-pane="1"></div>
      <div id="split" class="split-v">
        <div id="output"></div>
        <svg id="smm"></svg>
      </div>
      <div id="notification" class="notification">
        <div>
          <span id="content">Hey!</span>
        </div>
        <div id="options">
          <input type="radio" id="css" name="fav_language" value="CSS">
          <label for="css">CSS</label><br>
        </div>
        <div>
          <button>Submit</button>
          <button id="close">Close</button>
        </div>
      </div>
    </main>
    <script type="module" src="./src/main.ts"></script>
    <script type="module" src="./src/smm.js"></script>
  </body>
</html>
